name: NIL explicit GPU acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [amp, ddp, fsdp, all]
        default: all
      precision:
        type: choice
        options: [fp16, bf16, all]
        default: all
permissions:
  contents: read
jobs:
  gpu:
    # Explicitly provision a trusted Linux runner with CUDA Torch/NCCL first.
    runs-on: [self-hosted, linux, x64, nil-cuda]
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
      - name: Build without replacing the runner's explicitly provisioned GPU backend
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Require measured GPU tests (no skip-only acceptance)
        run: python scripts/accept_gpu.py --mode '${{ inputs.mode }}' --precision '${{ inputs.precision }}' --output gpu-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ inputs.mode }}-${{ inputs.precision }}
          path: gpu-acceptance.json
