name: NIL installed backend acceptance
on:
  workflow_dispatch:
  push:
    branches: ["codex/verify-*"]
  pull_request:
    paths: ['nil-sdk/**', 'scripts/**', 'pyproject.toml', '.github/workflows/sdk-backends.yml']
permissions:
  contents: read
jobs:
  installed:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [classical, torch, rl]
        versions: [minimum, current]
        exclude:
          - {os: macos-latest, profile: torch}
          - {os: windows-latest, profile: torch}
          - {os: macos-latest, profile: rl}
          - {os: windows-latest, profile: rl}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build wheel 'setuptools>=68' pytest
      - name: Install explicit minimum classical profile
        if: matrix.profile == 'classical' && matrix.versions == 'minimum'
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.4.2 pandas==2.3.3
      - name: Install current classical profile
        if: matrix.profile == 'classical' && matrix.versions == 'current'
        run: python -m pip install '.[classical,tabular]'
      - name: Install minimum CPU Torch profile
        if: matrix.profile != 'classical' && matrix.versions == 'minimum'
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4
      - name: Install current CPU Torch profile
        if: matrix.profile != 'classical' && matrix.versions == 'current'
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3'
      - name: Install explicit minimum RL profile
        if: matrix.profile == 'rl' && matrix.versions == 'minimum'
        run: python -m pip install stable-baselines3==2.4.0 sb3-contrib==2.4.0 gymnasium==1.0.0
      - name: Install current RL profile
        if: matrix.profile == 'rl' && matrix.versions == 'current'
        run: python -m pip install '.[rl-contrib]'
      - name: Build and install regular NIL wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess,sys
          subprocess.run([sys.executable,'-m','build','--wheel','--no-isolation','--outdir','dist'],check=True)
          wheel=next(Path('dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
      - name: Verify installed workflows and runnable examples
        run: python scripts/accept_backends.py --profile ${{ matrix.profile }} --output dist/backend-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.versions }}
          path: dist/
