name: NIL SDK
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[generative,classical,onnx,robotics,vision,dev]'
      - name: Install explicit external video test codecs
        shell: python
        run: |
          import shutil, subprocess
          if not shutil.which('ffmpeg') or not shutil.which('ffprobe'):
              subprocess.run(['sudo','apt-get','update'],check=True)
              subprocess.run(['sudo','apt-get','install','-y','--no-install-recommends','ffmpeg'],check=True)
      - run: python -m pytest nil-sdk/tests -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
      - run: nil demo --output /tmp/nil-demo
      - run: python scripts/build_sdk_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: nil-sdk-bundle
          path: dist/*-bundle.zip
