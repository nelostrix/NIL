name: nil-sdk CI/CD

on:
    push:
        branches: [main, develop]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    # ═══════════════════════════════════════
    # TEST
    # ═══════════════════════════════════════
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest
                  pip install -e ".[dev]" || pip install -e .

            - name: Run tests
              run: pytest tests/ -v --tb=short

    # ═══════════════════════════════════════
    # LINT
    # ═══════════════════════════════════════
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Lint
              run: |
                  pip install ruff || pip install flake8
                  ruff check nil/ 2>/dev/null || flake8 nil/ --max-line-length=100 --ignore=E501,W503,E402,F401

    # ═══════════════════════════════════════
    # BUILD
    # ═══════════════════════════════════════
    build:
        runs-on: ubuntu-latest
        needs: [test, lint]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Build wheel
              run: |
                  pip install build
                  python -m build --wheel

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nil-sdk-wheel
                  path: dist/*.whl

    # ═══════════════════════════════════════
    # DEPLOY
    # ═══════════════════════════════════════
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Build wheel
              run: |
                  pip install build
                  python -m build --wheel

            - name: Upload to Cloudflare R2
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
              run: |
                  pip install awscli
                  aws s3 cp dist/*.whl s3://nelo-packages/nil-sdk/ \
                    --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
                  echo "✓ nil-sdk $(ls dist/*.whl) uploaded to R2"

            - name: Notify nil-stacc
              if: success()
              run: |
                  curl -s -X POST \
                    -H "Accept: application/vnd.github.v3+json" \
                    -H "Authorization: token ${{ secrets.NIL_STACC_TRIGGER_TOKEN }}" \
                    https://api.github.com/repos/nelostrix/nil-stacc/dispatches \
                    -d '{"event_type":"nil-updated","client_payload":{"version":"${{ github.ref_name }}"}}'
                  echo "✓ nil-stacc notified"
