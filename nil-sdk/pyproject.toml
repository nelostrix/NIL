[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nil-sdk"
version = "0.2.1"
description = "AI model development SDK: native training, language models, optimization, artifacts and agents."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []  # Base installation must add NIL only. Backends are explicit extras.
authors = [
    {name = "Nelo Robotics Pvt Ltd"},
]
keywords = ["ai", "agents", "llm", "self-evolving", "continual-learning", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
rl-contrib = ["sb3-contrib>=2.4,<3", "stable-baselines3>=2.4,<3", "gymnasium>=1,<2", "torch>=2.6,<3"]
lightgbm = ["lightgbm>=4,<5", "scikit-learn>=1.4,<2"]
catboost = ["catboost>=1.2,<2", "scikit-learn>=1.4,<2"]
survival = ["lifelines>=0.30,<1", "pandas>=2,<4", "scikit-learn>=1.4,<2"]
torch = ["torch>=2.6,<3", "numpy>=1.26,<3"]
robotics = ["numpy>=1.26,<3"]
rl = ["stable-baselines3>=2.4,<3", "gymnasium>=1,<2", "torch>=2.6,<3"]
generative = ["torch>=2.6,<3", "numpy>=1.26,<3", "transformers>=4.45,<5", "peft>=0.13,<1"]
classical = ["scikit-learn>=1.4,<2"]
tabular = ["pandas>=2,<4", "scikit-learn>=1.4,<2"]
imbalance = ["imbalanced-learn>=0.12,<1", "scikit-learn>=1.4,<2"]
search = ["optuna>=4,<6", "scikit-learn>=1.4,<2"]
boosting = ["xgboost>=2,<4", "scikit-learn>=1.4,<2"]
boosting-cpu = ["xgboost-cpu>=2,<4", "scikit-learn>=1.4,<2"]
onnx = ["torch>=2.6,<3", "onnx>=1.16,<2", "onnxruntime>=1.18,<2", "numpy>=1.26,<3"]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
gemini = ["google-genai>=1.0.0"]
tracking = ["mlflow>=2.15,<4"]
all = ["sb3-contrib>=2.4,<3", "lightgbm>=4,<5", "catboost>=1.2,<2", "lifelines>=0.30,<1", "stable-baselines3>=2.4,<3", "gymnasium>=1,<2", "pandas>=2,<4", "imbalanced-learn>=0.12,<1", "optuna>=4,<6", "torch>=2.6,<3", "numpy>=1.26,<3", "transformers>=4.45,<5", "peft>=0.13,<1", "scikit-learn>=1.4,<2", "xgboost>=2,<4", "onnx>=1.16,<2", "onnxruntime>=1.18,<2", "anthropic>=0.30.0", "openai>=1.30.0", "google-genai>=1.0.0", "mlflow>=2.15,<4"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "build", "wheel"]

[project.scripts]
nil = "nil.cli:main"

[project.urls]
Homepage = "https://github.com/nelostrix/NIL"
Documentation = "https://nil.nelo.dev"
Repository = "https://github.com/nelostrix/NIL"

[tool.setuptools.packages.find]
include = ["nil*"]

[tool.setuptools.package-data]
nil = ["_help/*/help.md", "_kernels/*.c"]
#where = ["nil-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
