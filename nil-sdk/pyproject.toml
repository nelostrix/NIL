[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nil-sdk"
version = "0.2.1"
description = "AI model development SDK: native training, language models, optimization, artifacts and agents."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Nelo Robotics Pvt Ltd"},
]
keywords = ["ai", "agents", "llm", "self-evolving", "continual-learning", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.6,<3", "numpy>=1.26,<3"]
robotics = ["numpy>=1.26,<3"]
generative = ["torch>=2.6,<3", "numpy>=1.26,<3", "transformers>=4.45,<5", "peft>=0.13,<1"]
classical = ["scikit-learn>=1.4,<2"]
onnx = ["torch>=2.6,<3", "onnx>=1.23.2,<2", "onnxruntime>=1.18,<2", "numpy>=1.26,<3"]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
gemini = ["google-genai>=1.0.0"]
tracking = ["mlflow>=2.15,<4"]
all = ["torch>=2.6,<3", "numpy>=1.26,<3", "transformers>=4.45,<5", "peft>=0.13,<1", "scikit-learn>=1.4,<2", "onnx>=1.23.2,<2", "onnxruntime>=1.18,<2", "anthropic>=0.30.0", "openai>=1.30.0", "google-genai>=1.0.0", "mlflow>=2.15,<4"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "build", "wheel"]

[project.scripts]
nil = "nil.cli:main"

[project.urls]
Homepage = "https://github.com/nelostrix/NIL"
Documentation = "https://nil.nelo.dev"
Repository = "https://github.com/nelostrix/NIL"

[tool.setuptools.packages.find]
include = ["nil*"]
#where = ["nil-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
