[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nil-sdk"
version = "0.1.0"
description = "Self-Evolving Domain Agent Framework — AI agents that get better every time they run."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Nelo Robotics Pvt Ltd"},
]
keywords = ["ai", "agents", "llm", "self-evolving", "continual-learning", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
all = ["anthropic>=0.30.0", "openai>=1.30.0"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/nelo-robotics/nil"
Documentation = "https://nil.nelo.dev"
Repository = "https://github.com/nelo-robotics/nil"

[tool.setuptools.packages.find]
include = ["nil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
